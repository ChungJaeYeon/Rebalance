<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="color-scheme" content="light dark">
<title>Rebalance</title>
<style>
  :root {
    --bg: #fff; --fg: #111; --muted: #6b7280; --line: #e5e7eb; --card: #f9fafb;
    --buy: #15803d; --sell: #b91c1c; --accent: #2563eb;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000; --fg: #f3f4f6; --muted: #9ca3af; --line: #27272a; --card: #111113;
            --buy: #4ade80; --sell: #f87171; --accent: #60a5fa; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: max(12px, env(safe-area-inset-top)) 12px max(24px, env(safe-area-inset-bottom));
  }
  h1 { font-size: 20px; margin: 8px 0 12px; }
  .grid {
    display: grid; grid-template-columns: 1.4fr 1.2fr 0.8fr 32px; gap: 6px; align-items: center;
  }
  .grid .hdr { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  input {
    width: 100%; min-height: 44px; padding: 8px 10px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg);
  }
  input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  input.num { text-align: right; font-variant-numeric: tabular-nums; }
  button {
    min-height: 44px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font-size: 16px; cursor: pointer;
  }
  .grid button.rm { min-height: 44px; width: 32px; padding: 0; font-size: 20px; color: var(--muted); }
  .actions { display: flex; gap: 8px; margin: 12px 0; }
  .actions button { flex: 1; }
  .out { margin-top: 8px; border-top: 1px solid var(--line); }
  .row {
    display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 6px; padding: 10px 0;
    border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .row.hdr { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 6px 0; }
  .row > :not(:first-child) { text-align: right; }
  .row .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .buy { color: var(--buy); font-weight: 600; }
  .sell { color: var(--sell); font-weight: 600; }
  .total { margin-top: 10px; color: var(--muted); font-size: 14px; }
  .hint { color: var(--muted); font-size: 13px; margin-top: 12px; }
</style>
</head>
<body>
<h1>Rebalance</h1>

<div class="grid" id="inputs">
  <div class="hdr">Asset</div><div class="hdr">Value</div><div class="hdr">Ratio</div><div></div>
</div>

<div class="actions">
  <button id="add">+ Add asset</button>
  <button id="clear">Clear values</button>
</div>

<div class="out" id="out"></div>
<div class="total" id="total"></div>
<p class="hint">Trade = target − current. Target = total × ratio ÷ Σratio. Everything is saved on this device.</p>

<script id="calc">
// Pure. assets: [{value:number, ratio:number}] → [{target, trade}] or null if no valid ratios.
function computeTrades(assets) {
  var total = 0, ratioSum = 0;
  for (var i = 0; i < assets.length; i++) {
    var a = assets[i];
    if (isFinite(a.value)) total += a.value;
    if (isFinite(a.ratio) && a.ratio > 0) ratioSum += a.ratio;
  }
  if (ratioSum <= 0) return null;
  return assets.map(function (a) {
    var r = (isFinite(a.ratio) && a.ratio > 0) ? a.ratio : 0;
    var v = isFinite(a.value) ? a.value : 0;
    var target = total * r / ratioSum;
    return { target: target, trade: target - v };
  });
}
</script>

<script>
(function () {
  var KEY = 'rebalance.v1';
  var $inputs = document.getElementById('inputs');
  var $out = document.getElementById('out');
  var $total = document.getElementById('total');

  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (Array.isArray(s) && s.length) return s;
    } catch (e) {}
    return [{ name: '', value: '', ratio: '' }, { name: '', value: '', ratio: '' }, { name: '', value: '', ratio: '' }];
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(readRows())); } catch (e) {}
  }
  function readRows() {
    var rows = [];
    var els = $inputs.querySelectorAll('.r');
    for (var i = 0; i < els.length; i++) {
      var r = els[i];
      rows.push({
        name: r.querySelector('.name').value,
        value: r.querySelector('.value').value,
        ratio: r.querySelector('.ratio').value
      });
    }
    return rows;
  }

  function el(tag, cls, attrs) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    for (var k in attrs || {}) e.setAttribute(k, attrs[k]);
    return e;
  }

  function addRow(data) {
    var wrap = el('div', 'r');
    wrap.style.display = 'contents';
    var name = el('input', 'name', { type: 'text', placeholder: 'e.g. VTI', autocapitalize: 'characters', autocorrect: 'off' });
    var value = el('input', 'value num', { type: 'text', inputmode: 'decimal', placeholder: '0' });
    var ratio = el('input', 'ratio num', { type: 'text', inputmode: 'decimal', placeholder: '1' });
    var rm = el('button', 'rm', { type: 'button', 'aria-label': 'Remove' });
    rm.textContent = '×';
    name.value = data.name || ''; value.value = data.value || ''; ratio.value = data.ratio || '';
    rm.onclick = function () { wrap.remove(); update(); };
    wrap.appendChild(name); wrap.appendChild(value); wrap.appendChild(ratio); wrap.appendChild(rm);
    $inputs.appendChild(wrap);
  }

  function num(s) {
    var n = parseFloat(String(s).replace(/[,\s$€£]/g, ''));
    return isFinite(n) ? n : NaN;
  }
  var fmt = new Intl.NumberFormat(undefined, { maximumFractionDigits: 2, minimumFractionDigits: 2 });

  function update() {
    save();
    var rows = readRows();
    var assets = rows.map(function (r) { return { value: num(r.value), ratio: num(r.ratio) }; });
    var res = computeTrades(assets);
    $out.innerHTML = '';
    if (!res) { $total.textContent = ''; return; }

    var total = 0;
    assets.forEach(function (a) { if (isFinite(a.value)) total += a.value; });
    var ratioSum = 0;
    assets.forEach(function (a) { if (isFinite(a.ratio) && a.ratio > 0) ratioSum += a.ratio; });

    var hdr = el('div', 'row hdr');
    ['Asset', 'Target %', 'Target', 'Trade'].forEach(function (t) { var d = el('div'); d.textContent = t; hdr.appendChild(d); });
    $out.appendChild(hdr);

    res.forEach(function (x, i) {
      var r = el('div', 'row');
      var n = el('div', 'name'); n.textContent = rows[i].name || ('Asset ' + (i + 1));
      var p = el('div'); p.textContent = (assets[i].ratio > 0 ? (100 * assets[i].ratio / ratioSum).toFixed(1) : '0.0') + '%';
      var t = el('div'); t.textContent = fmt.format(x.target);
      var d = el('div');
      var tr = Math.round(x.trade * 100) / 100;
      if (tr > 0) { d.className = 'buy'; d.textContent = 'Buy ' + fmt.format(tr); }
      else if (tr < 0) { d.className = 'sell'; d.textContent = 'Sell ' + fmt.format(-tr); }
      else { d.textContent = '—'; }
      r.appendChild(n); r.appendChild(p); r.appendChild(t); r.appendChild(d);
      $out.appendChild(r);
    });
    $total.textContent = 'Total: ' + fmt.format(total);
  }

  load().forEach(addRow);
  $inputs.addEventListener('input', update);
  document.getElementById('add').onclick = function () { addRow({}); update(); $inputs.lastChild.querySelector('.name').focus(); };
  document.getElementById('clear').onclick = function () {
    $inputs.querySelectorAll('.value').forEach(function (i) { i.value = ''; });
    update();
  };
  update();
})();
</script>
</body>
</html>
